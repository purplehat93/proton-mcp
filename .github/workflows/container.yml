name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/proton-mcp

jobs:
  build-scan:
    name: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: proton-mcp:ci

      - name: Verify non-root runtime
        run: |
          user="$(docker image inspect proton-mcp:ci --format '{{.Config.User}}')"
          case "${user}" in
            ""|0|0:0|root|root:root)
              echo "Container is configured to run as root: ${user:-<empty>}" >&2
              exit 1
              ;;
          esac
          echo "Container default user: ${user}"

      - name: Smoke test compiled MCP module
        run: |
          docker run --rm proton-mcp:ci \
            --input-type=module \
            -e 'const m = await import("./dist/index.js"); if (typeof m.createServer !== "function") throw new Error("createServer export missing"); console.error("MCP module smoke test passed")'

      - name: Report image size
        run: |
          bytes="$(docker image inspect proton-mcp:ci --format '{{.Size}}')"
          mib="$((bytes / 1024 / 1024))"
          echo "Runtime image size: ${mib} MiB (${bytes} bytes)"
          docker history --format 'table {{.Size}}\t{{.CreatedBy}}' proton-mcp:ci

      - name: Scan runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proton-mcp:ci
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Gate runtime vulnerabilities
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("trivy-results.json", encoding="utf-8") as fh:
              report = json.load(fh)

          findings = []
          for result in report.get("Results") or []:
              target = result.get("Target", "?")
              for vuln in result.get("Vulnerabilities") or []:
                  severity = vuln.get("Severity", "UNKNOWN")
                  fixed = vuln.get("FixedVersion") or ""
                  if severity not in {"HIGH", "CRITICAL"} or not fixed:
                      continue
                  findings.append((severity, target, vuln.get("PkgName", "?"), vuln.get("VulnerabilityID", "?"), vuln.get("InstalledVersion", "?"), fixed))

          if not findings:
              print("No fixable HIGH/CRITICAL runtime vulnerabilities found.")
              raise SystemExit(0)

          print("Fixable HIGH/CRITICAL runtime vulnerabilities:")
          print("severity\ttarget\tpackage\tcve\tinstalled\tfixed")
          for row in sorted(findings):
              print("\t".join(row))
          print(f"Total: {len(findings)}", file=sys.stderr)
          raise SystemExit(1)
          PY

      - name: Generate SPDX SBOM for validated image
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: proton-mcp:ci
          format: spdx-json
          output: sbom.spdx.json
          skip-setup-trivy: true

      - name: Save validated image
        if: github.event_name == 'push'
        run: docker save proton-mcp:ci --output proton-mcp.tar

      - name: Upload validated image bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-image
          path: |
            proton-mcp.tar
            sbom.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Download validated image bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-image
          path: validated

      - name: Load validated image
        run: docker load --input validated/proton-mcp.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push validated image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          source_image="proton-mcp:ci"
          sha_tag="${IMAGE}:sha-${GITHUB_SHA}"
          tags=("${sha_tag}")

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${IMAGE}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid proton-mcp release tag: ${GITHUB_REF_NAME}; expected vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            tags+=("${IMAGE}:${version}" "${IMAGE}:${major}.${minor}")
          fi

          for tag in "${tags[@]}"; do
            docker tag "${source_image}" "${tag}"
            docker push "${tag}"
          done

          digest="sha256:$(docker buildx imagetools inspect "${sha_tag}" --raw | sha256sum | awk '{print $1}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published validated image digest: ${digest}"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: validated/sbom.spdx.json
          push-to-registry: true

  notify:
    name: notify
    if: always()
    needs: [build-scan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Notify Discord
        if: env.DISCORD_WEBHOOK_URL != '' && (needs.build-scan.result == 'failure' || needs.publish.result == 'failure' || needs.publish.result == 'success')
        env:
          MESSAGE: "${{ needs.publish.result == 'success' && 'Container published' || 'Container workflow failed' }} for ${{ github.repository }} on ${{ github.ref_name }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          jq -n --arg content "$MESSAGE" '{content: $content}' |
            curl --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary @- "$DISCORD_WEBHOOK_URL"
