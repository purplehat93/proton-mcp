name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  notify:
    name: notify
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Notify Discord on failure
        if: env.DISCORD_WEBHOOK_URL != '' && needs.check.result == 'failure'
        env:
          TITLE: "GitHub CI failed"
          COLOR: "15158332"
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg title "$TITLE" \
            --arg color "$COLOR" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg url "$RUN_URL" \
            '{username:"CI Alerts",embeds:[{title:$title,url:$url,color:($color|tonumber),fields:[{name:"Repository",value:$repository,inline:true},{name:"Branch",value:$branch,inline:true},{name:"Commit",value:($commit|.[0:7]),inline:true}],footer:{text:"GitHub Actions"}}]}' |
            curl --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary @- "$DISCORD_WEBHOOK_URL"
