name: One-shot security fix

on:
  push:
    branches: [feat/imap-mailbox-tools]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Remove unsafe HTML-to-text fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/mail.ts')
          s = p.read_text()
          start = s.index('function htmlToText(html: string): string {')
          end = s.index('\nexport class ProtonMailbox', start)
          s = s[:start] + s[end+1:]
          s = s.replace('const text = plain?.text ?? (html ? htmlToText(html.text) : null);', 'const text = plain?.text ?? null;')
          p.write_text(s)
      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: npm run check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mail.ts
          git commit -m "Avoid unsafe HTML text conversion"
          git push
